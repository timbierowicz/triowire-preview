<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrioWire Preview</title>
<meta http-equiv="refresh" content="0; url=sitemap.html">
<script>
  (function () {
    var base = '/';
    if (location.hostname.endsWith('github.io')) {
      var seg = location.pathname.split('/').filter(Boolean);
      if (seg.length) base = '/' + seg[0] + '/';
    }
    location.replace(base + 'sitemap.html');
  })();
</script>
</head>
<body>
<p>Redirecting to the <a href="sitemap.html">TrioWire Preview sitemap</a>&hellip;</p>
</body>
</html>
